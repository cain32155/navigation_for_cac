# Single source of truth for arena geometry, obstacle randomization, mission goals
# and the start-zone localization markers.
#
# Read by: launch/cac_sim.launch.py (world generation via cac_sim/arena_layout.py),
# mission_state_machine, marker_localizer, arena_boundary_publisher, wall_filter.
# The coordinate system is the arena/world frame described at the top of
# worlds/cac_arena.sdf. The localization stack makes ROS `map` == this frame.
#
#   ros2 launch cac_sim cac_sim.launch.py seed:=42

/**:
  ros__parameters:
    arena:
      length: 9.0             # along X, inner wall faces at x = +-4.5
      width: 5.0              # along Y, inner wall faces at y = +-2.5
      sand_depth: 0.30        # thickness of the generated sand-bed tiles (rulebook: ~30 cm)

    # Zone bounds as [x_min, x_max]; all zones span the full arena width in Y.
    # The rulebook text gives no zone sizes (only a reference diagram); lengths
    # sum to the 9 m arena. The 1.8 m start zone fits the rover at every N/S/E/W
    # start heading with start_margin and room to turn in place.
    zones:
      starting_zone:     [-4.5, -2.7]
      obstacle_zone:     [-2.7,  2.0]
      excavation_zone:   [ 2.0,  3.5]
      construction_zone: [ 3.5,  4.5]
      berm_target: [4.0, 0.0]   # [x, y] centre of the berm/dump target (marker r=0.4 m)

    robot:
      # Footprint rectangle relative to base_footprint (x forward), i.e. the
      # outer collision envelope in the stowed configuration. MUST match the
      # `footprint` in config/nav2_params.yaml and urdf/ -- test/test_consistency.py
      # checks all three.
      footprint_front: 0.66
      footprint_rear: 0.47
      footprint_half_width: 0.37
      # Wheel-centre x offset from base_footprint (validation tools use it to
      # check wheels against crater bowls).
      wheel_x_offset: 0.35
      # Gap kept between the start footprint and every starting-zone boundary.
      # Must be >= localization.keepout_band + Nav2 footprint_padding (+ a cell)
      # or Nav2 sees the start pose as overlapping the lethal boundary band.
      start_margin: 0.20
      # Extra clearance beyond the turn-in-place circle (farthest footprint
      # corner) kept from walls and obstacles at the start pose, so the
      # localization spin can never touch anything.
      spin_margin: 0.10

    obstacles:
      num_boulders: 3          # rulebook: "at least three"
      num_craters: 3           # rulebook: "at least three"
      boulder_diameter_min: 0.30   # rulebook: ~30-40 cm
      boulder_diameter_max: 0.40
      # Boulders are sunk by a random fraction of their radius so their height
      # above the sand varies (rulebook: "varying heights").
      boulder_bury_fraction_min: 0.0
      boulder_bury_fraction_max: 0.4
      # Rulebook: "Similar or smaller boulders may also be present in the
      # excavation zone."
      num_excavation_boulders: 1
      excavation_boulder_diameter_min: 0.20
      excavation_boulder_diameter_max: 0.30
      # Craters are real depressions (cosine bowls). Diameter is the TOTAL
      # rim-to-rim width (rulebook: "up to 40-50 cm"). Depth is not given by the
      # rulebook; 5-15 cm is an assumption.
      crater_diameter_min: 0.40
      crater_diameter_max: 0.50
      crater_depth_min: 0.05
      crater_depth_max: 0.15
      # Flat sand kept around each bowl inside its square mesh patch.
      crater_patch_margin: 0.05
      # Minimum centre-to-centre distance between obstacles. This alone does NOT
      # guarantee passability (edge gaps can be < 0.4 m); the reachability check
      # below does.
      min_obstacle_clearance: 0.9
      # Obstacle centres stay this far inside their zone's x-range and the walls.
      zone_edge_margin: 0.35
      # Layout acceptance: the real footprint grown by validation_margin must be
      # able to reach every mission goal from the start pose (and come back);
      # validation_wall_margin is kept to the walls (>= keepout band; equal to
      # robot.start_margin so the start pose itself passes).
      # Rejected layouts are redrawn deterministically from the seed.
      validation_margin: 0.10
      validation_wall_margin: 0.20
      max_layout_attempts: 200

    mission:
      # Navigation goals [x, y, yaw] in the arena frame: where base_footprint
      # parks, NOT the task targets. Chosen from the arm's reach (arm.xacro,
      # config/arm_params.yaml):
      #  - excavation_approach: the dig pose puts the bucket lip 0.93-1.08 m
      #    ahead of base_footprint -> sand is taken at x = 3.28-3.43, inside the
      #    excavation zone (sand may only come from there).
      #  - construction_approach: stowed front edge 0.31 m into the construction
      #    zone, 0.69 m from the east wall; the pour lands 0.91 m ahead -> x = 4.06,
      #    on the berm target. Stopping 0.20 m short (Nav2's goal tolerance) still
      #    leaves 0.11 m across x = 3.5, which the mission requires (zone_cross_margin)
      #    so a ~0.1 m localization error cannot fake the crossing. At x = 3.05 the
      #    front was claimed 2 cm across while ground truth was 11 cm short (seed 10,
      #    r4_3). The old goal (berm centre, x = 4.0) put the footprint through the wall.
      #  - return_approach: start-zone centre, facing west so the camera sees the
      #    start-zone markers again.
      excavation_approach:   [2.35, 0.0, 0.0]
      construction_approach: [3.15, 0.0, 0.0]
      return_approach:       [-3.55, 0.0, 3.14159265]
      # Arrival is accepted only when the localized pose is within these of the
      # goal AND the zone condition for that leg holds.
      arrival_xy_tolerance: 0.30
      arrival_yaw_tolerance: 0.60
      # excavation/construction: the localized footprint must cross the zone line
      # by this much (ground truth, in gt_monitor, only needs "any part across")
      zone_cross_margin: 0.10
      max_goal_attempts: 3     # per leg, before the mission ends in FAILED
      # Nav2 footprint_padding (test_consistency checks it): the escape motion after
      # START_OCCUPIED clears the footprint as the planner sees it.
      footprint_padding: 0.06
      # Obstacle-zone survey after the marker fix, before the first leg: face each
      # heading (deg, map frame, 0 = east) and hold still so the depth camera sees
      # the ground next to the start zone. 30 deg steps with a 66 deg camera view
      # cover about -93..+93 deg at 1.0-2.2 m ahead.
      survey_headings: [-60.0, -30.0, 0.0, 30.0, 60.0]
      survey_hold_sec: 1.2
      survey_turn_rate: 0.35
      survey_timeout_sec: 60.0
      leg_timeout_sec: 240.0   # per attempt
      num_cycles: 1            # excavate -> dump cycles before returning
      excavation_duration_sec: 8.0
      dump_duration_sec: 5.0

    localization:
      # Width of the band inside each wall whose LiDAR returns are discarded
      # before mapping/costmaps/collision monitor (walls must not be used for
      # navigation or collision avoidance -- rulebook Autonomy Rule 3).
      wall_filter_band: 0.30
      # Lethal band inside each wall in the a-priori arena-boundary costmap
      # layer (keeps the planner off the walls without sensing them). The
      # margin to a wall is keepout_band + footprint_padding = 0.17 m (was
      # 0.15 + 0.02 before the padding grew to 0.06).
      keepout_band: 0.11

    markers:
      # ArUco markers placed per "Regulations on Mounting Beacons and Markers":
      # max 5, <= 25x25 cm each, <= 60 cm high; one on the wall attached to the
      # start zone, the others on the start-zone frame along its two sides
      # (interpreted as the north and south boundaries of the starting zone).
      # `size` is the black square edge, `board_size` the whole printed board.
      # poses = [x, y, z, yaw] per id (flattened -- ROS parameters cannot hold
      # lists of dicts): marker face centre; yaw = direction the face points.
      dictionary: DICT_4X4_50
      size: 0.20
      board_size: 0.25
      ids: [0, 1, 2, 3, 4]
      poses: [-4.499, 0.0, 0.30, 0.0,
              -4.05, 2.499, 0.35, -1.5707963,
              -3.15, 2.499, 0.35, -1.5707963,
              -4.05, -2.499, 0.35, 1.5707963,
              -3.15, -2.499, 0.35, 1.5707963]
